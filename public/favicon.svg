<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="hsl(195,100%,90%)" stop-opacity="0.95"/>
      <stop offset="35%" stop-color="hsl(205,100%,70%)" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="hsl(220,100%,60%)" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="hsl(190,100%,96%)" stop-opacity="0.95"/>
      <stop offset="55%" stop-color="hsl(200,100%,85%)" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="hsl(220,100%,70%)" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="55%" stop-color="hsl(190,100%,92%)"/>
      <stop offset="100%" stop-color="hsl(200,100%,75%)" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- space backdrop -->
  <rect width="64" height="64" rx="13" fill="#02030a"/>

  <!-- tilted twin lighthouse beams emitted from the core -->
  <g transform="translate(32 32) rotate(-28)">
    <polygon points="0,-2 30,-7 30,7 0,2" fill="url(#beam)"/>
    <polygon points="0,-2 -30,-7 -30,7 0,2" fill="url(#beam)" opacity="0.65"/>
  </g>

  <!-- soft cyan glow halo -->
  <circle cx="32" cy="32" r="20" fill="url(#halo)"/>

  <!-- bright neutron-star core -->
  <circle cx="32" cy="32" r="8" fill="url(#core)"/>
  <circle cx="32" cy="32" r="3" fill="#ffffff"/>
</svg>
